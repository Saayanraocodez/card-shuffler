; PlatformIO project for the card shuffler firmware (ESP32 DevKitC).
;   pio run -e esp32dev            build
;   pio run -e esp32dev -t upload  flash
;   pio device monitor -b 115200   serial console (type `help`)
; The same sources build in the Arduino IDE: open firmware/shuffler/shuffler.ino with the
; "ESP32 Dev Module" board selected (esp32 core 2.0.x or 3.x).
[platformio]
src_dir = shuffler

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wno-unused-function
