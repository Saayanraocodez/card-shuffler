<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .part { fill:#d9e2ef; stroke:#2b3a55; stroke-width:1.5; }
    .card { fill:#fff8dc; stroke:#8a7a3a; stroke-width:1; }
    .roller { fill:#b9b9b9; stroke:#333; stroke-width:1.5; }
    .oring { fill:none; stroke:#111; stroke-width:3; }
    .blade { fill:#d4a017; stroke:#7a5c00; stroke-width:1; }
    .sensor { fill:#ffcc66; stroke:#b06000; stroke-width:1.5; }
    .beam { stroke:#e53935; stroke-width:1.5; stroke-dasharray:4,3; }
    .lbl { fill:#111; }
    .dim { stroke:#444; stroke-width:1; }
    .arrow { fill:#1a49a8; }
    .motor { fill:#333; }
  </style>
  <text x="20" y="28" font-size="18" font-weight="bold">Mechanism section at the centreline (card frame; whole assembly tilted 10°, well end low)</text>

  <!-- rotate the whole card frame by 10 degrees clockwise about a point to show the tilt -->
  <g transform="translate(90,120) rotate(10)">
    <!-- feeder plate / hopper floor (Z=0 line at y=200) -->
    <rect x="0" y="200" width="560" height="10" class="part"/>
    <text x="10" y="226" class="lbl">feeder deck plate (card path plane Z = 0)</text>

    <!-- hopper walls -->
    <rect x="20" y="40" width="8" height="160" class="part"/>
    <rect x="300" y="40" width="8" height="112" class="part"/>
    <!-- gate block -->
    <rect x="300" y="152" width="8" height="46.5" class="part" fill="#f4b183"/>
    <text x="240" y="30" class="lbl">HOPPER (deck face down)</text>
    <!-- deck -->
    <rect x="30" y="150" width="268" height="50" class="card"/>
    <text x="80" y="180" class="lbl">52 cards ≈ 16 mm</text>
    <!-- lid pressure boss -->
    <rect x="215" y="60" width="60" height="90" class="part" fill="#efe4a8"/>
    <text x="222" y="100" class="lbl" font-size="11">lid boss</text>
    <text x="222" y="114" class="lbl" font-size="11">felt pad</text>
    <!-- gate gap annotation -->
    <line x1="308" y1="198.5" x2="360" y2="150" class="dim"/>
    <text x="362" y="146" class="lbl" font-size="12">gate lip: gap 0.45 mm (feeler set)</text>

    <!-- feed roller (axis at x=256, below plate) -->
    <circle cx="256" cy="214" r="27" class="roller"/>
    <circle cx="256" cy="214" r="27" class="oring"/>
    <text x="222" y="262" class="lbl" font-size="12">feed roller Ø27</text>
    <text x="222" y="276" class="lbl" font-size="12">(O-rings, N20 motor)</text>
    <!-- transport roller -->
    <circle cx="380" cy="214" r="27" class="roller"/>
    <circle cx="380" cy="214" r="27" class="oring"/>
    <text x="345" y="262" class="lbl" font-size="12">transport roller Ø27</text>
    <!-- idler -->
    <circle cx="380" cy="186" r="12" class="roller"/>
    <rect x="330" y="150" width="90" height="12" class="part" fill="#bfe3c5"/>
    <text x="330" y="146" class="lbl" font-size="12">idler arm (spring)</text>
    <!-- beam B (vertical) -->
    <line x1="340" y1="200" x2="340" y2="162" class="beam"/>
    <rect x="335" y="200" width="10" height="8" class="sensor"/>
    <text x="318" y="216" class="lbl" font-size="11">beam B</text>

    <!-- card in transit -->
    <rect x="300" y="197" width="150" height="3" class="card"/>

    <!-- well -->
    <rect x="452" y="-20" width="8" height="100" class="part"/>   <!-- front wall above slot -->
    <rect x="452" y="207" width="8" height="90" class="part"/>    <!-- front wall below slot (sleeve) -->
    <rect x="752" y="-20" width="8" height="317" class="part"/>   <!-- back wall -->
    <rect x="748" y="-20" width="4" height="317" fill="#8d6e63"/> <!-- felt pad -->
    <text x="560" y="-30" class="lbl">WELL (elevator)</text>
    <!-- beam W (vertical through slot) -->
    <line x1="456" y1="207" x2="456" y2="80" class="beam"/>
    <text x="462" y="100" class="lbl" font-size="11">beam W</text>
    <text x="462" y="114" class="lbl" font-size="11">(card fully in)</text>
    <!-- entry slot label -->
    <text x="462" y="196" class="lbl" font-size="11">entry slot</text>

    <!-- upper stack resting on blades -->
    <rect x="465" y="120" width="280" height="70" class="card"/>
    <text x="520" y="160" class="lbl">upper stack (n−k cards) on the blades</text>
    <!-- blades: shown as the plane (they enter from the sides) -->
    <rect x="565" y="190" width="80" height="2.5" class="blade"/>
    <text x="648" y="196" class="lbl" font-size="12">blade plane Z = +2.5 (2 × 0.5 mm brass, from the sides)</text>
    <!-- gap -->
    <rect x="465" y="193" width="280" height="12" fill="#ffffff" stroke="none"/>
    <text x="470" y="204" class="lbl" font-size="11" fill="#b3261e">3 mm gap ← new card enters here</text>
    <!-- lower stack -->
    <rect x="465" y="205" width="280" height="40" class="card"/>
    <text x="540" y="230" class="lbl">lower stack (k cards)</text>
    <!-- platform -->
    <rect x="470" y="245" width="270" height="8" class="part" fill="#d8b4e2"/>
    <text x="540" y="270" class="lbl">platform (45 mm wide: blades pass beside it)</text>
    <!-- beam S -->
    <line x1="700" y1="60" x2="700" y2="130" class="beam" transform="rotate(90 700 95)"/>
    <text x="640" y="52" class="lbl" font-size="11">beam S (stack top, across the well at Z = +14)</text>

    <!-- carriage arm & column -->
    <rect x="740" y="245" width="60" height="8" class="part" fill="#d8b4e2"/>
    <rect x="800" y="225" width="20" height="40" class="part" fill="#d8b4e2"/>
    <text x="826" y="252" class="lbl" font-size="12">carriage: T8 nut + 2 × LM8UU</text>
    <rect x="808" y="-80" width="6" height="380" fill="#999"/>
    <text x="826" y="-20" class="lbl" font-size="12">T8×8 lead screw + 8 mm rods</text>
    <rect x="785" y="-130" width="50" height="45" class="motor"/>
    <text x="840" y="-100" class="lbl" font-size="12" fill="#fff">.</text>
    <text x="840" y="-105" class="lbl" font-size="12">NEMA 17 on top of the column</text>
    <text x="826" y="290" class="lbl" font-size="12">endstop at the bottom</text>
  </g>

  <!-- legend / flow -->
  <g transform="translate(20,470)">
    <text x="0" y="0" font-weight="bold">Per-card sequence (firmware `run_shuffle`)</text>
    <text x="0" y="22">1. Draw gap index j ∈ {0..i} (ChaCha20 DRBG, rejection sampling).  2. Elevator puts boundary j at the blade plane: Z = 2.5 − j·t̄.</text>
    <text x="0" y="42">3. Servos push both blades in (7 mm).  4. Elevator drops 3.0 mm: cards above j stay on the blades, a 3 mm gap opens at the entry slot.</text>
    <text x="0" y="62">5. Feed roller + transport roller push the bottom hopper card through the gate and the slot; beam B and beam W confirm pickup, entry, full insertion.</text>
    <text x="0" y="82">6. Elevator rises 2.2 mm, blades retract, the upper stack settles 0.7 mm onto the new card.  Every 4 cards: raise until beam S blocks → stack height → t̄.</text>
    <text x="0" y="110" fill="#444" font-size="12">All dimensions in cad/params.scad. The 10° tilt lets cards coast to the felt back pad and keeps the stack edges aligned for blade entry.</text>
  </g>
</svg>
