<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .part { fill:#d9e2ef; stroke:#2b3a55; stroke-width:1.5; } .fin { stroke:#a0885a; stroke-width:1.2; } .card { fill:#fff8dc; stroke:#8a7a3a; stroke-width:1; }
    .roller { fill:#b9b9b9; stroke:#333; stroke-width:1.5; } .sensor { fill:#ffcc66; stroke:#b06000; stroke-width:1.5; } .beam { stroke:#e53935; stroke-width:1.5; stroke-dasharray:4,3; }
    .lbl { fill:#111; } .small { font-size:11px; fill:#333; } .shroud { fill:none; stroke:#2b3a55; stroke-width:5; } .shutter { fill:none; stroke:#e08a00; stroke-width:5; }
  </style>
  <text x="20" y="28" font-size="18" font-weight="bold">Wheel shuffler — section at the centreline (viewed along the wheel axis; 3 o'clock = 0°, angles counter-clockwise)</text>
  <g transform="translate(560,400)">
    <!-- wheel: hub, fins, discs (scale 2 px/mm) -->
    <circle cx="0" cy="0" r="44" fill="#e7dcc4" stroke="#8a7a3a"/>
    <g id="fins">
      <line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(0)"/>
    </g>
    <g>
      <line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-0)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-20)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-40)"/>
      <line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-60)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-80)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-100)"/>
      <line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-120)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-140)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-160)"/>
      <line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-180)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-200)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-220)"/>
      <line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-240)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-260)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-280)"/>
      <line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-300)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-320)"/><line x1="44" y1="0" x2="155" y2="0" class="fin" transform="rotate(-340)"/>
    </g>
    <circle cx="0" cy="0" r="155" fill="none" stroke="#a0885a" stroke-width="1.5"/>
    <text x="-60" y="-165" class="small">54 fins (18 drawn); disc/fin tips r = 77.5</text>
    <!-- seated cards (a few), r 22..85.5 -->
    <rect x="44" y="-1" width="127" height="1.6" class="card" transform="rotate(-100)"/><rect x="44" y="-1" width="127" height="1.6" class="card" transform="rotate(-140)"/><rect x="44" y="-1" width="127" height="1.6" class="card" transform="rotate(-260)"/>
    <!-- shroud lower half 172..368 with window 202..214 -->
    <path d="M 175.2 -24.6 A 177 177 0 0 0 -164.7 64.6" class="shroud" transform="scale(1,-1)"/>
    <path d="M -177 0 A 177 177 0 0 0 -164.7 64.6" class="shroud"/>
    <path d="M -164.7 64.6 A 177 177 0 0 0 -156.2 83.2" class="shutter"/>
    <text x="-300" y="120" class="small" fill="#e08a00">shutter blade (orange) inside the shroud: covers the</text><text x="-300" y="134" class="small" fill="#e08a00">window while loading (ramped ends), slides 17.5° to open</text>
    <path d="M -144.7 102.1 A 177 177 0 0 0 0 177 A 177 177 0 0 0 177 0" class="shroud"/>
    <text x="60" y="200" class="small">shroud, r 88.5–91.5, 172°–368°</text>
    <!-- entry feeder at 46.67° (fin) : draw plate along the fin direction from r=82 to r=178 -->
    <g transform="rotate(-46.667)">
      <rect x="164" y="0" width="192" height="6" class="part"/>   <!-- plate under the card plane -->
      <rect x="219" y="-100" width="130" height="6" class="part"/> <!-- hopper walls sketch -->
      <rect x="349" y="-100" width="6" height="106" class="part"/>
      <rect x="219" y="-95" width="130" height="50" class="card"/> <!-- deck -->
      <circle cx="242" cy="27" r="27" class="roller"/><text x="200" y="66" class="small" transform="rotate(46.667 200 66)">feed roller Ø27</text>
      <circle cx="189" cy="16" r="16" class="roller"/><circle cx="189" cy="-14" r="12" class="roller"/>
      <rect x="216" y="-6" width="3" height="8" fill="#f4b183" stroke="#333"/>
      <line x1="210" y1="-30" x2="210" y2="6" class="beam"/><line x1="169" y1="-30" x2="169" y2="6" class="beam"/>
      <rect x="180" y="-32" width="100" height="0" />
    </g>
    <text x="180" y="-250" class="lbl">HOPPER at 50°: deck face down, slides against the gate under 0.77 g</text>
    <text x="180" y="-234" class="small">gate (0.45 mm) → beam B → entry nip Ø16 (r 96) → card slides down fin k to the hub; beams E (r 81.5) and S (r 86.8) run tower to tower</text>
    <!-- exit at 208.33° -->
    <g transform="rotate(-208.333)">
      <rect x="164" y="-6" width="20" height="6" fill="none"/>
      <circle cx="208" cy="16" r="16" class="roller"/><circle cx="208" cy="-14" r="12" class="roller"/>
      <rect x="226" y="34" width="160" height="6" class="part"/>   <!-- chute floor 20 mm below -->
      <rect x="386" y="-20" width="6" height="60" class="part"/>   <!-- end wall -->
      <rect x="240" y="26" width="127" height="8" class="card"/>   <!-- pile -->
      <line x1="228" y1="-30" x2="228" y2="6" class="beam"/>
    </g>
    <text x="-540" y="130" class="lbl">EXIT at 205°: shutter opens, card slides out under 0.47 g</text>
    <text x="-540" y="146" class="small">into the exit nip → beam X → chute inclined 28°, felt end wall; deck leans against the wall</text>
    <!-- axis, towers hint -->
    <circle cx="0" cy="0" r="8" fill="#888"/><text x="12" y="-10" class="small">M8 rod, 608 bearings in the towers, NEMA 17 direct drive</text>
    <text x="-40" y="-190" class="small">index tab + sensor at 12 o'clock</text>
  </g>
  <g transform="translate(20,660)">
    <text x="0" y="0" font-weight="bold">Cycle (firmware `run_shuffle`)</text>
    <text x="0" y="20">LOAD: for each card, draw a uniform random EMPTY slot s → rotate fin s to 46.67° (shortest way) → feed: gate beam B, entry beam E → card seats on the hub → beam E must still be blocked (else look at s±1 and correct the map).</text>
    <text x="0" y="40">UNLOAD: open the shutter; for s = 0..53 occupied: rotate fin s+1 to 208.33° → card slides into the running nip → beam X blocks then clears → next. Close the shutter. Output order = slot order = exact Fisher–Yates.</text>
    <text x="0" y="60" class="small">Dimensions from cad/params.scad. Cards lie flat on a fin at the entry and exit; in the lower half the shroud retains them; in the upper half gravity seats them against the hub.</text>
  </g>
</svg>
