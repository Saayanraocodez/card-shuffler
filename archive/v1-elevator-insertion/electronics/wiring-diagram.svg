<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .box { fill:#f7f7f7; stroke:#333; stroke-width:1.5; }
    .mcu { fill:#e8f0fe; stroke:#1a49a8; stroke-width:2; }
    .pwr { fill:#fdecea; stroke:#b3261e; stroke-width:1.5; }
    .drv { fill:#e6f4ea; stroke:#137333; stroke-width:1.5; }
    .sen { fill:#fff8e1; stroke:#b06000; stroke-width:1.5; }
    .t { fill:#111; }
    .h { font-weight:bold; font-size:13px; }
    .net { stroke:#333; stroke-width:1.4; fill:none; }
    .vbat { stroke:#b3261e; stroke-width:2.2; fill:none; }
    .v5 { stroke:#d97706; stroke-width:2; fill:none; }
    .gnd { stroke:#555; stroke-width:1.4; fill:none; stroke-dasharray:5,3; }
    .sig { stroke:#1a49a8; stroke-width:1.3; fill:none; }
    .small { font-size:10px; fill:#444; }
  </style>
  <text x="20" y="28" class="h" font-size="18">Card shuffler — wiring diagram (ESP32 DevKitC, 3S Li-ion)</text>
  <text x="20" y="46" class="small">Red = battery bus (9–12.6 V). Orange = 5 V rail. Blue = logic signals (3.3 V). Dashed = GND. All grounds are common (star point at the perfboard).</text>

  <!-- POWER CHAIN -->
  <rect x="20" y="70" width="150" height="90" class="pwr"/>
  <text x="30" y="90" class="h">3S Li-ion pack</text>
  <text x="30" y="106" class="t">11.1 V nom, 2200 mAh</text>
  <text x="30" y="120" class="t">built-in BMS (OV/UV/OC)</text>
  <text x="30" y="134" class="t">XT30 or JST-XH out</text>
  <text x="30" y="148" class="small">P+ / P− terminals</text>

  <rect x="200" y="70" width="90" height="40" class="pwr"/>
  <text x="208" y="88" class="h">Fuse 3 A</text>
  <text x="208" y="102" class="small">polyfuse or blade</text>

  <rect x="320" y="70" width="110" height="40" class="pwr"/>
  <text x="328" y="88" class="h">Power switch</text>
  <text x="328" y="102" class="small">SPST toggle ≥ 3 A</text>

  <rect x="200" y="125" width="110" height="40" class="pwr"/>
  <text x="206" y="143" class="h">Charge jack</text>
  <text x="206" y="157" class="small">5.5×2.1 mm, to 12.6 V 1 A charger</text>

  <rect x="470" y="60" width="170" height="60" class="pwr"/>
  <text x="478" y="80" class="h">Buck 12 V → 5.0 V, 3 A</text>
  <text x="478" y="96" class="t">MP1584 / LM2596 module</text>
  <text x="478" y="110" class="small">set output to 5.00 V before connecting loads</text>

  <!-- VBAT bus -->
  <line x1="170" y1="90" x2="200" y2="90" class="vbat"/>
  <line x1="290" y1="90" x2="320" y2="90" class="vbat"/>
  <line x1="430" y1="90" x2="470" y2="90" class="vbat"/>
  <text x="440" y="84" class="small">VBAT</text>
  <!-- charge jack to pack terminals (before fuse & switch, through BMS) -->
  <line x1="185" y1="145" x2="200" y2="145" class="vbat"/>
  <line x1="185" y1="145" x2="185" y2="90" class="vbat"/>
  <text x="312" y="148" class="small">(+) to P+, (−) to P−</text>
  <!-- VBAT to TMC VM -->
  <line x1="450" y1="90" x2="450" y2="230" class="vbat"/>
  <line x1="450" y1="230" x2="700" y2="230" class="vbat"/>
  <!-- VBAT to divider -->
  <line x1="450" y1="230" x2="450" y2="470" class="vbat"/>

  <!-- 5V rail -->
  <line x1="640" y1="90" x2="700" y2="90" class="v5"/>
  <text x="650" y="84" class="small">+5 V</text>
  <line x1="700" y1="90" x2="700" y2="130" class="v5"/>
  <line x1="700" y1="130" x2="1330" y2="130" class="v5"/>
  <text x="1000" y="124" class="small">+5 V rail (ESP32 VIN, DRV8833 VM, servos, IR LEDs, NeoPixel)</text>

  <!-- ESP32 -->
  <rect x="560" y="300" width="260" height="410" class="mcu"/>
  <text x="600" y="322" class="h" font-size="15">ESP32 DevKitC (30-pin)</text>
  <text x="600" y="338" class="small">USB only for programming / test dumps</text>
  <!-- left pins -->
  <g class="t">
    <text x="568" y="365">VIN (5 V)</text>
    <text x="568" y="385">GND</text>
    <text x="568" y="415">GPIO25  STEP</text>
    <text x="568" y="435">GPIO26  DIR</text>
    <text x="568" y="455">GPIO27  EN (act. low)</text>
    <text x="568" y="485">GPIO16  FEED_IN1</text>
    <text x="568" y="505">GPIO17  FEED_IN2</text>
    <text x="568" y="525">GPIO4   TRANS_IN1</text>
    <text x="568" y="545">GPIO5   TRANS_IN2</text>
    <text x="568" y="565">GPIO23  DRV nSLEEP</text>
    <text x="568" y="595">GPIO18  SERVO_L</text>
    <text x="568" y="615">GPIO19  SERVO_R</text>
    <text x="568" y="645">GPIO13  IR_LED_EN</text>
    <text x="568" y="665">GPIO14  NEOPIXEL</text>
    <text x="568" y="685">GPIO33  BUZZER</text>
  </g>
  <!-- right pins -->
  <g class="t">
    <text x="700" y="415">GPIO34  BEAM_B (ADC)</text>
    <text x="700" y="435">GPIO35  BEAM_W (ADC)</text>
    <text x="700" y="455">GPIO36  BEAM_S (ADC)</text>
    <text x="700" y="485">GPIO39  VBAT_SENSE</text>
    <text x="700" y="515">GPIO32  ENDSTOP</text>
    <text x="700" y="535">GPIO21  BUTTON</text>
    <text x="700" y="565">GPIO22  DECK_SENSE (opt.)</text>
    <text x="700" y="595">3V3 → sensor pull-ups</text>
    <text x="700" y="625">GND</text>
  </g>
  <!-- ESP32 power -->
  <line x1="700" y1="130" x2="700" y2="150" class="v5"/>
  <line x1="700" y1="150" x2="545" y2="150" class="v5"/>
  <line x1="545" y1="150" x2="545" y2="361" class="v5"/>
  <line x1="545" y1="361" x2="566" y2="361" class="v5"/>
  <line x1="566" y1="381" x2="530" y2="381" class="gnd"/>
  <text x="500" y="385" class="small">GND</text>

  <!-- TMC2208 -->
  <rect x="880" y="200" width="200" height="120" class="drv"/>
  <text x="890" y="220" class="h">TMC2208 stepstick</text>
  <text x="890" y="236" class="t">VM = VBAT (+100 µF 25 V at pins)</text>
  <text x="890" y="250" class="t">VIO = 3V3, MS1 = MS2 = 3V3 (1/16)</text>
  <text x="890" y="264" class="t">STEP / DIR / EN from ESP32</text>
  <text x="890" y="278" class="t">Vref ≈ 0.9 V → ≈ 0.65 A RMS</text>
  <text x="890" y="292" class="small">A4988 (Vref 0.5 V) is a drop-in alternative</text>
  <text x="890" y="308" class="small">1A/1B/2A/2B → NEMA 17</text>
  <line x1="700" y1="230" x2="880" y2="230" class="vbat"/>
  <line x1="820" y1="411" x2="850" y2="411" class="sig"/><line x1="850" y1="411" x2="850" y2="300" class="sig"/><line x1="850" y1="300" x2="880" y2="300" class="sig"/>
  <text x="826" y="405" class="small">STEP/DIR/EN (3 wires)</text>

  <rect x="1120" y="200" width="120" height="70" class="box"/>
  <text x="1128" y="220" class="h">NEMA 17</text>
  <text x="1128" y="236" class="t">17HS4401 / 17HS4023</text>
  <text x="1128" y="250" class="t">4-wire, 1.7 A rated</text>
  <text x="1128" y="264" class="small">T8×8 lead screw + coupler</text>
  <line x1="1080" y1="240" x2="1120" y2="240" class="net"/>

  <!-- DRV8833 -->
  <rect x="880" y="360" width="200" height="120" class="drv"/>
  <text x="890" y="380" class="h">DRV8833 dual H-bridge</text>
  <text x="890" y="396" class="t">VM = +5 V rail (+100 µF)</text>
  <text x="890" y="410" class="t">AIN1/AIN2 ← GPIO16/17 (feed)</text>
  <text x="890" y="424" class="t">BIN1/BIN2 ← GPIO4/5 (transport)</text>
  <text x="890" y="438" class="t">nSLEEP ← GPIO23, nFAULT n/c</text>
  <text x="890" y="452" class="small">Motors on AOUT1/2, BOUT1/2</text>
  <line x1="1000" y1="130" x2="1000" y2="360" class="v5"/>
  <line x1="820" y1="495" x2="860" y2="495" class="sig"/><line x1="860" y1="495" x2="860" y2="430" class="sig"/><line x1="860" y1="430" x2="880" y2="430" class="sig"/>
  <text x="826" y="490" class="small">5 wires</text>

  <rect x="1120" y="350" width="120" height="50" class="box"/>
  <text x="1128" y="370" class="h">N20 feed motor</text>
  <text x="1128" y="386" class="t">6 V 300 rpm, 2 wires</text>
  <rect x="1120" y="420" width="120" height="50" class="box"/>
  <text x="1128" y="440" class="h">N20 transport</text>
  <text x="1128" y="456" class="t">6 V 300 rpm, 2 wires</text>
  <line x1="1080" y1="375" x2="1120" y2="375" class="net"/>
  <line x1="1080" y1="445" x2="1120" y2="445" class="net"/>

  <!-- Servos -->
  <rect x="880" y="510" width="200" height="70" class="drv"/>
  <text x="890" y="530" class="h">2 × MG90S servo</text>
  <text x="890" y="546" class="t">V+ = +5 V rail, GND, signal</text>
  <text x="890" y="560" class="t">SIG_L ← GPIO18, SIG_R ← GPIO19</text>
  <text x="890" y="574" class="small">470 µF on the 5 V rail near the servos</text>
  <line x1="1000" y1="480" x2="1000" y2="510" class="v5"/>
  <line x1="820" y1="605" x2="855" y2="605" class="sig"/><line x1="855" y1="605" x2="855" y2="555" class="sig"/><line x1="855" y1="555" x2="880" y2="555" class="sig"/>

  <!-- IR beams -->
  <rect x="880" y="610" width="360" height="130" class="sen"/>
  <text x="890" y="630" class="h">3 × IR beam (940 nm LED + phototransistor)</text>
  <text x="890" y="646" class="t">LED anodes ← +5 V through 150 Ω each; cathodes joined → NPN collector (2N2222)</text>
  <text x="890" y="660" class="t">NPN base ← GPIO13 through 1 kΩ, emitter → GND (LEDs switched for ambient rejection)</text>
  <text x="890" y="674" class="t">Phototransistor: collector → 3V3, emitter → GPIO34/35/36 and 10 kΩ to GND</text>
  <text x="890" y="688" class="t">BEAM_B = gate (vertical), BEAM_W = well slot (vertical), BEAM_S = stack top (horizontal)</text>
  <text x="890" y="702" class="small">Firmware reads each channel LED-on minus LED-off; threshold set in calibration.</text>
  <text x="890" y="716" class="small">Use 3 mm parts (IR204/PT204 class or Vishay TSAL4400/TEFT4300).</text>
  <text x="890" y="730" class="small">GPIO34–39 are input-only and have no internal pull-ups: the 10 kΩ pull-downs are required.</text>
  <line x1="820" y1="640" x2="880" y2="640" class="sig"/>
  <line x1="820" y1="411" x2="840" y2="411" class="sig"/>
  <line x1="1000" y1="580" x2="1000" y2="610" class="v5"/>

  <!-- Battery sense -->
  <rect x="380" y="440" width="150" height="80" class="sen"/>
  <text x="388" y="460" class="h">VBAT sense</text>
  <text x="388" y="476" class="t">100 kΩ (VBAT) / 33 kΩ (GND)</text>
  <text x="388" y="490" class="t">→ GPIO39, 100 nF to GND</text>
  <text x="388" y="504" class="small">12.6 V → 3.13 V at the pin</text>
  <line x1="450" y1="470" x2="380" y2="470" class="vbat"/>
  <line x1="530" y1="480" x2="545" y2="480" class="sig"/><line x1="545" y1="480" x2="545" y2="720" class="sig"/><line x1="545" y1="720" x2="840" y2="720" class="sig"/><line x1="840" y1="720" x2="840" y2="481" class="sig"/><line x1="840" y1="481" x2="820" y2="481" class="sig"/>

  <!-- Endstop, button -->
  <rect x="380" y="540" width="150" height="60" class="sen"/>
  <text x="388" y="560" class="h">Endstop microswitch</text>
  <text x="388" y="576" class="t">NC contact to GND ← GPIO32</text>
  <text x="388" y="590" class="small">internal pull-up; NC = wire-break safe</text>
  <rect x="380" y="615" width="150" height="60" class="sen"/>
  <text x="388" y="635" class="h">Start button</text>
  <text x="388" y="651" class="t">momentary to GND ← GPIO21</text>
  <text x="388" y="665" class="small">internal pull-up, debounced in firmware</text>

  <!-- Indicators -->
  <rect x="380" y="700" width="150" height="80" class="box"/>
  <text x="388" y="720" class="h">Indicators</text>
  <text x="388" y="736" class="t">WS2812B pixel ← GPIO14</text>
  <text x="388" y="750" class="small">330 Ω series; pixel V+ via 1N4001 from 5 V</text>
  <text x="388" y="764" class="t">Passive piezo ← GPIO33</text>
  <text x="388" y="778" class="small">100 Ω series</text>

  <!-- Optional deck sense -->
  <rect x="380" y="800" width="150" height="50" class="box"/>
  <text x="388" y="820" class="h">Optional TCRT5000</text>
  <text x="388" y="836" class="t">deck-loaded sensor ← GPIO22</text>

  <!-- notes -->
  <rect x="20" y="200" width="330" height="200" class="box"/>
  <text x="30" y="220" class="h">Notes</text>
  <text x="30" y="238" class="t">1. TMC2208 VM must never be applied without GND first;</text>
  <text x="30" y="252" class="t">   use a 4-pin JST-XH for the motor, never hot-plug it.</text>
  <text x="30" y="266" class="t">2. Set the buck to 5.00 V with nothing connected.</text>
  <text x="30" y="280" class="t">3. Set TMC Vref = 0.9 V (≈0.65 A RMS) with motor unplugged.</text>
  <text x="30" y="294" class="t">4. The BMS protects the cells; the 3 A fuse protects the wiring.</text>
  <text x="30" y="308" class="t">5. Charger connects to the pack terminals (through the BMS),</text>
  <text x="30" y="322" class="t">   upstream of the switch, so charging works with power off.</text>
  <text x="30" y="336" class="t">6. GND star point: buck GND, ESP32 GND, driver GNDs, sensor</text>
  <text x="30" y="350" class="t">   returns, pack P−. Keep the stepper wires away from the ADC.</text>
  <text x="30" y="364" class="t">7. All external connectors: JST-XH 2.54 mm on the perfboard.</text>
  <text x="30" y="378" class="t">8. Nothing here needs mains; the charger is a sealed adapter.</text>

  <rect x="20" y="430" width="330" height="110" class="box"/>
  <text x="30" y="450" class="h">Connector list (perfboard, JST-XH)</text>
  <text x="30" y="468" class="small">J1 pack (2), J2 switch (2), J3 charge jack (2), J4 stepper (4), J5 feed motor (2),</text>
  <text x="30" y="482" class="small">J6 transport motor (2), J7/J8 servos (3+3), J9 beam B (4: LED+,LED−,PT+,PT out),</text>
  <text x="30" y="496" class="small">J10 beam W (4), J11 beam S (4), J12 endstop (2), J13 button (2), J14 pixel (3),</text>
  <text x="30" y="510" class="small">J15 buzzer (2), J16 optional TCRT (3).</text>
  <text x="30" y="530" class="small">Full pin table: docs/04-electronics.md §4.3</text>

  <!-- GND rail -->
  <line x1="530" y1="381" x2="530" y2="900" class="gnd"/>
  <line x1="530" y1="900" x2="1330" y2="900" class="gnd"/>
  <text x="1200" y="915" class="small">GND (common)</text>
  <line x1="1330" y1="130" x2="1330" y2="900" class="gnd" stroke-opacity="0"/>
</svg>
