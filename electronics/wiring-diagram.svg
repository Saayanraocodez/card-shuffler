<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .box { fill:#f7f7f7; stroke:#333; stroke-width:1.5; } .mcu { fill:#e8f0fe; stroke:#1a49a8; stroke-width:2; }
    .pwr { fill:#fdecea; stroke:#b3261e; stroke-width:1.5; } .drv { fill:#e6f4ea; stroke:#137333; stroke-width:1.5; } .sen { fill:#fff8e1; stroke:#b06000; stroke-width:1.5; }
    .t { fill:#111; } .h { font-weight:bold; font-size:13px; } .small { font-size:10px; fill:#444; }
    .vbat { stroke:#b3261e; stroke-width:2.2; fill:none; } .v5 { stroke:#d97706; stroke-width:2; fill:none; } .sig { stroke:#1a49a8; stroke-width:1.3; fill:none; } .gnd { stroke:#555; stroke-width:1.4; fill:none; stroke-dasharray:5,3; } .net { stroke:#333; stroke-width:1.4; fill:none; }
  </style>
  <text x="20" y="28" class="h" font-size="18">Wheel card shuffler — wiring (ESP32 DevKitC, 3S Li-ion)</text>
  <text x="20" y="46" class="small">Red = battery bus 9–12.6 V. Orange = 5 V rail. Blue = 3.3 V logic. Dashed = GND (star point on the perfboard).</text>

  <rect x="20" y="70" width="150" height="90" class="pwr"/><text x="30" y="90" class="h">3S Li-ion pack</text><text x="30" y="106" class="t">11.1 V, 2200 mAh, BMS</text><text x="30" y="120" class="t">XT30 / JST-XH</text>
  <rect x="200" y="70" width="90" height="40" class="pwr"/><text x="208" y="88" class="h">Fuse 3 A</text>
  <rect x="320" y="70" width="110" height="40" class="pwr"/><text x="328" y="88" class="h">Power switch</text><text x="328" y="102" class="small">SPST ≥ 3 A</text>
  <rect x="200" y="125" width="110" height="40" class="pwr"/><text x="206" y="143" class="h">Charge jack</text><text x="206" y="157" class="small">5.5×2.1, to pack terminals</text>
  <rect x="470" y="60" width="170" height="60" class="pwr"/><text x="478" y="80" class="h">Buck 12 → 5.0 V, 3 A</text><text x="478" y="96" class="t">MP1584 / LM2596</text><text x="478" y="110" class="small">set 5.00 V before connecting loads</text>
  <line x1="170" y1="90" x2="200" y2="90" class="vbat"/><line x1="290" y1="90" x2="320" y2="90" class="vbat"/><line x1="430" y1="90" x2="470" y2="90" class="vbat"/><text x="440" y="84" class="small">VBAT</text>
  <line x1="185" y1="145" x2="200" y2="145" class="vbat"/><line x1="185" y1="145" x2="185" y2="90" class="vbat"/>
  <line x1="450" y1="90" x2="450" y2="230" class="vbat"/><line x1="450" y1="230" x2="880" y2="230" class="vbat"/><line x1="450" y1="230" x2="450" y2="470" class="vbat"/>
  <line x1="640" y1="90" x2="700" y2="90" class="v5"/><line x1="700" y1="90" x2="700" y2="130" class="v5"/><line x1="700" y1="130" x2="1330" y2="130" class="v5"/><text x="960" y="124" class="small">+5 V rail (ESP32 VIN, DRV8833 ×2 VM, servo, IR LEDs, index module, pixel)</text>

  <rect x="560" y="300" width="270" height="430" class="mcu"/><text x="600" y="322" class="h" font-size="15">ESP32 DevKitC (30-pin)</text><text x="600" y="338" class="small">USB only for programming / test dumps</text>
  <g class="t">
    <text x="568" y="365">VIN (5 V)</text><text x="568" y="385">GND</text>
    <text x="568" y="415">GPIO25  STEP</text><text x="568" y="435">GPIO26  DIR</text><text x="568" y="455">GPIO27  EN (act. low)</text>
    <text x="568" y="485">GPIO16  FEED_IN1</text><text x="568" y="505">GPIO17  FEED_IN2</text><text x="568" y="525">GPIO4   NIPE_IN1</text><text x="568" y="545">GPIO5   NIPE_IN2</text>
    <text x="568" y="565">GPIO15  NIPX_IN1</text><text x="568" y="585">GPIO2   NIPX_IN2</text><text x="568" y="605">GPIO23  DRV nSLEEP (both)</text>
    <text x="568" y="635">GPIO18  SERVO (shutter)</text><text x="568" y="665">GPIO13  IR_LED_EN</text><text x="568" y="685">GPIO14  NEOPIXEL</text><text x="568" y="705">GPIO33  BUZZER</text>
  </g>
  <g class="t">
    <text x="705" y="415">GPIO34  BEAM_B (ADC)</text><text x="705" y="435">GPIO35  BEAM_E (ADC)</text><text x="705" y="455">GPIO36  BEAM_X (ADC)</text>
    <text x="705" y="485">GPIO39  VBAT_SENSE</text><text x="705" y="515">GPIO32  INDEX (digital)</text><text x="705" y="535">GPIO21  BUTTON</text>
    <text x="705" y="565">GPIO22  DECK_SENSE (opt.)</text><text x="705" y="595">3V3 → sensor pull-ups</text><text x="705" y="625">GND</text>
  </g>
  <line x1="700" y1="130" x2="700" y2="150" class="v5"/><line x1="700" y1="150" x2="545" y2="150" class="v5"/><line x1="545" y1="150" x2="545" y2="361" class="v5"/><line x1="545" y1="361" x2="566" y2="361" class="v5"/>
  <line x1="566" y1="381" x2="530" y2="381" class="gnd"/><text x="500" y="385" class="small">GND</text>

  <rect x="880" y="200" width="200" height="120" class="drv"/><text x="890" y="220" class="h">TMC2208 stepstick</text><text x="890" y="236" class="t">VM = VBAT (+100 µF 25 V)</text><text x="890" y="250" class="t">VIO = 3V3, MS1 = MS2 = 3V3 (1/16)</text><text x="890" y="264" class="t">STEP / DIR / EN ← ESP32</text><text x="890" y="278" class="t">Vref ≈ 1.0 V → ≈ 0.7 A RMS</text><text x="890" y="292" class="small">A4988 (Vref 0.55 V) drop-in from a 3S pack</text><text x="890" y="308" class="small">1A/1B/2A/2B → NEMA 17</text>
  <line x1="830" y1="411" x2="850" y2="411" class="sig"/><line x1="850" y1="411" x2="850" y2="300" class="sig"/><line x1="850" y1="300" x2="880" y2="300" class="sig"/><text x="836" y="405" class="small">3 wires</text>
  <rect x="1120" y="200" width="120" height="70" class="box"/><text x="1128" y="220" class="h">NEMA 17 (wheel)</text><text x="1128" y="236" class="t">17HS4401 class, 4-wire</text><text x="1128" y="250" class="small">5→8 mm coupler, M8 rod</text><line x1="1080" y1="240" x2="1120" y2="240" class="net"/>

  <rect x="880" y="350" width="200" height="110" class="drv"/><text x="890" y="370" class="h">DRV8833 #1</text><text x="890" y="386" class="t">VM = +5 V (+100 µF)</text><text x="890" y="400" class="t">AIN1/AIN2 ← GPIO16/17 (feed)</text><text x="890" y="414" class="t">BIN1/BIN2 ← GPIO4/5 (entry nip)</text><text x="890" y="428" class="t">nSLEEP ← GPIO23</text>
  <rect x="880" y="480" width="200" height="90" class="drv"/><text x="890" y="500" class="h">DRV8833 #2</text><text x="890" y="516" class="t">VM = +5 V (+100 µF)</text><text x="890" y="530" class="t">AIN1/AIN2 ← GPIO15/2 (exit nip)</text><text x="890" y="544" class="t">nSLEEP ← GPIO23; B channel spare</text>
  <line x1="1000" y1="130" x2="1000" y2="350" class="v5"/><line x1="1000" y1="460" x2="1000" y2="480" class="v5"/>
  <line x1="830" y1="515" x2="860" y2="515" class="sig"/><line x1="860" y1="515" x2="860" y2="420" class="sig"/><line x1="860" y1="420" x2="880" y2="420" class="sig"/><line x1="860" y1="515" x2="860" y2="535" class="sig"/><line x1="860" y1="535" x2="880" y2="535" class="sig"/><text x="836" y="509" class="small">7 wires</text>
  <rect x="1120" y="345" width="120" height="44" class="box"/><text x="1128" y="363" class="h">N20 feed</text><text x="1128" y="379" class="t">6 V 300 rpm</text>
  <rect x="1120" y="400" width="120" height="44" class="box"/><text x="1128" y="418" class="h">N20 entry nip</text>
  <rect x="1120" y="480" width="120" height="44" class="box"/><text x="1128" y="498" class="h">N20 exit nip</text>
  <line x1="1080" y1="367" x2="1120" y2="367" class="net"/><line x1="1080" y1="422" x2="1120" y2="422" class="net"/><line x1="1080" y1="502" x2="1120" y2="502" class="net"/>

  <rect x="880" y="590" width="200" height="60" class="drv"/><text x="890" y="610" class="h">MG90S shutter servo</text><text x="890" y="626" class="t">V+ = +5 V, GND, SIG ← GPIO18</text><text x="890" y="640" class="small">470 µF on the 5 V rail near the servo</text>
  <line x1="1000" y1="570" x2="1000" y2="590" class="v5"/><line x1="830" y1="631" x2="880" y2="631" class="sig"/>

  <rect x="880" y="670" width="360" height="140" class="sen"/><text x="890" y="690" class="h">Beams B, E, X: 3 × (940 nm IR LED + phototransistor)</text>
  <text x="890" y="706" class="t">LED anodes ← +5 V via 150 Ω each; cathodes → NPN collector (2N2222); base ← GPIO13 via 1 kΩ; emitter → GND</text>
  <text x="890" y="720" class="t">Phototransistor collector → 3V3; emitter → GPIO34/35/36 and 10 kΩ to GND (input-only pins: pull-downs required)</text>
  <text x="890" y="734" class="t">B = gate beam (feeder plate), E = entry/occupancy beam (plate tip, r 84.5), X = exit beam (chute, r 114)</text>
  <text x="890" y="752" class="h">Index: slotted optical module (comparator, 3 pins)</text>
  <text x="890" y="768" class="t">VCC ← +5 V (or 3V3 per module), GND, DO → GPIO32 (LOW when the disc tab is in the slot)</text>
  <text x="890" y="784" class="small">Mount in index_bracket on the +Y tower at 12 o'clock; the tab on the +Y disc passes through the slot.</text>
  <line x1="830" y1="411" x2="840" y2="411" class="sig"/><line x1="1000" y1="650" x2="1000" y2="670" class="v5"/>

  <rect x="380" y="440" width="150" height="80" class="sen"/><text x="388" y="460" class="h">VBAT sense</text><text x="388" y="476" class="t">100 kΩ / 33 kΩ → GPIO39</text><text x="388" y="490" class="t">100 nF to GND</text><text x="388" y="504" class="small">12.6 V → 3.13 V</text>
  <line x1="450" y1="470" x2="380" y2="470" class="vbat"/>
  <rect x="380" y="540" width="150" height="55" class="sen"/><text x="388" y="560" class="h">Start button</text><text x="388" y="576" class="t">momentary to GND ← GPIO21</text>
  <rect x="380" y="610" width="150" height="80" class="box"/><text x="388" y="630" class="h">Indicators</text><text x="388" y="646" class="t">WS2812B ← GPIO14 (330 Ω)</text><text x="388" y="660" class="small">pixel V+ via 1N4001 from 5 V</text><text x="388" y="674" class="t">piezo ← GPIO33 (100 Ω)</text>
  <rect x="380" y="705" width="150" height="50" class="box"/><text x="388" y="725" class="h">Optional TCRT5000</text><text x="388" y="741" class="t">deck-loaded ← GPIO22</text>

  <rect x="20" y="200" width="330" height="215" class="box"/><text x="30" y="220" class="h">Notes</text>
  <text x="30" y="238" class="t">1. Never hot-plug the stepper; TMC2208 needs GND before VM.</text>
  <text x="30" y="252" class="t">2. Set the buck to 5.00 V with nothing connected.</text>
  <text x="30" y="266" class="t">3. Set TMC Vref = 1.0 V with the motor unplugged.</text>
  <text x="30" y="280" class="t">4. GPIO15 and GPIO2 are strapping pins: the DRV8833 inputs do not</text>
  <text x="30" y="294" class="t">   load them, and nSLEEP is held low until setup() runs.</text>
  <text x="30" y="308" class="t">5. Charger wired to the pack terminals upstream of the switch.</text>
  <text x="30" y="322" class="t">6. GND star point: buck, ESP32, drivers, sensor returns, pack P−.</text>
  <text x="30" y="336" class="t">7. Keep the stepper leads away from the phototransistor leads.</text>
  <text x="30" y="350" class="t">8. External connectors: JST-XH 2.54 mm on the perfboard.</text>
  <text x="30" y="380" class="h">Connector list</text>
  <text x="30" y="396" class="small">J1 pack (2) J2 switch (2) J3 jack (2) J4 stepper (4) J5 feed (2) J6 entry nip (2) J7 exit nip (2) J8 servo (3)</text>
  <text x="30" y="410" class="small">J9/J10/J11 beams B/E/X (4 each) J12 index (3) J13 button (2) J14 pixel (3) J15 buzzer (2) J16 TCRT (3)</text>

  <line x1="530" y1="381" x2="530" y2="920" class="gnd"/><line x1="530" y1="920" x2="1330" y2="920" class="gnd"/><text x="1200" y="935" class="small">GND (common)</text>
</svg>
